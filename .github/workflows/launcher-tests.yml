name: Launcher regression tests
on:
  pull_request:
    branches: [testing]
  push:
    branches: [testing]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v
      - run: shellcheck scripts/prepare-state.sh scripts/start-server.sh
