name: gutenprint-printer-app
min-version: 2.5
element-path: elements

(@):
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

variables:
  abi: gnu
  gcc-triplet: "%{arch}-linux-%{abi}"
  lib: "lib/%{gcc-triplet}"
  libdir: "%{prefix}/%{lib}"

sandbox:
  build-arch: "%{arch}"

artifacts:
  - url: https://gbm.gnome.org:11003
  - url: https://cache.projectbluefin.io:11001

source-caches:
  - url: https://gbm.gnome.org:11003
  - url: https://cache.projectbluefin.io:11001

plugins:
  - origin: junction
    junction: printing-stack.bst:freedesktop-sdk.bst:plugins/buildstream-plugins.bst
    elements:
      - autotools
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    sources:
      - git_repo

sources:
  git_repo:
    config:
      ref-format: git-describe
